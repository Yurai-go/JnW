<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfmart — My Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

  <nav class="wm-nav" role="navigation">
    <div class="wm-nav__inner">
      <a href="index.html" class="wm-nav__logo">
        <div class="wm-nav__logo-mark" aria-hidden="true">W</div>
        <span class="wm-nav__logo-text">Welf<span>mart</span></span>
      </a>

      <ul class="wm-nav__links" role="list">
        <li><a href="index.html"       class="wm-nav__link" data-page="index.html">Home</a></li>
        <li><a href="store.html"       class="wm-nav__link" data-page="store.html">Menu</a></li>
        <li><a href="dashboard.html"   class="wm-nav__link active" data-page="dashboard.html">My Orders</a></li>
      </ul>

      <div class="wm-nav__actions">
        <div id="nav-user-area" style="display:none; align-items:center; gap:var(--space-3);">
          <a href="dashboard.html" class="wm-nav__link" style="color:rgba(255,255,255,.75); font-size:var(--text-sm);">
            👋 <span id="nav-user-name">Account</span>
          </a>
          <button id="nav-logout-btn" class="btn btn-ghost btn-sm" style="border-color:rgba(255,255,255,.2); color:rgba(255,255,255,.65);">
            Sign Out
          </button>
        </div>
        <button class="wm-nav__hamburger">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <main class="dashboard-page container section-pad-sm">
    
    <header class="store-header reveal">
      <h1 class="store-header__title">My <em>Dashboard</em></h1>
      <p class="store-header__desc">Track your active orders and review your past purchases.</p>
    </header>

    <div class="dashboard-layout reveal reveal-delay-1">
      
      <aside class="dashboard-sidebar">
        <div class="card profile-card">
          <div class="profile-card__avatar" id="dash-avatar">--</div>
          <h2 class="profile-card__name" id="dash-name">Loading...</h2>
          <div class="profile-card__role" id="dash-role">...</div>
          
          <hr class="divider" style="margin-block: var(--space-4);" />
          
          <div class="profile-stats">
            <div class="stat-box">
              <span class="stat-box__label">Total Orders</span>
              <span class="stat-box__val" id="dash-order-count">0</span>
            </div>
            <div class="stat-box">
              <span class="stat-box__label">Total Spent</span>
              <span class="stat-box__val" id="dash-total-spent">Rp 0</span>
            </div>
          </div>
        </div>
        
        <a href="store.html" class="btn btn-primary w-full" style="margin-top: var(--space-4);">
          Start New Order
        </a>
      </aside>

      <section class="dashboard-content">
        <div class="dashboard-content__header">
          <h2 class="dashboard-content__title">Order History</h2>
        </div>

        <div id="dash-empty" class="dash-empty" style="display: none;">
          <div class="dash-empty__icon">🧾</div>
          <h3>No orders yet</h3>
          <p>You haven't placed any orders with Welfmart. Let's fix that!</p>
        </div>

        <div id="dash-orders-list" class="orders-list">
          </div>
      </section>

    </div>
  </main>

  <script type="module" src="../js/utils/seed.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
